name: Build data

on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/**'
      - '.github/workflows/build-data.yml'

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/generate.py
      - run: python pipeline/run_pipeline.py --no-llm
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: public/data/
